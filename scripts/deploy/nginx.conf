user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css;
    server {
        listen 443 ssl;
        server_name wingrivals.com;
        ssl_certificate /etc/letsencrypt/live/wingrivals.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wingrivals.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin "*" always;
        root /srv/wingrivals/current/web;
        location / {
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
        # Keep every version's game assets available to clients already connected.
        location /releases/ {
            root /srv/wingrivals;
            try_files $uri =404;
        }
    }
}
